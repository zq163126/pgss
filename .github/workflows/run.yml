name: Run pgss Redeem Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-pgss-run]
#  schedule:
    # 每 4 小时自动触发运行一次
 #   - cron: '0 */4 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器内核
        run: |
          npx playwright install chromium --with-deps

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 运行 pgss 自动兑换脚本
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          COOKIE_SID: ${{ secrets.COOKIE_SID }}
          PROXY: ${{ secrets.PROXY }}
          HEADED: "False"
          SHOW_LOG: "True"
          LOG_FILE: "pgss.log"
        run: |
          python main.py
