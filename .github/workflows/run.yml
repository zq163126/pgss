name: Run pgss Redeem Bot

on:
  workflow_dispatch: # 允许通过 API 或手动触发

jobs:
  run-redeem:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖与 Playwright 浏览器
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # 安装 Playwright 所需的浏览器内核及 Linux 系统依赖
          playwright install --with-deps chromium

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行主程序
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          COOKIE_SID: ${{ secrets.COOKIE_SID }}
        run: |
          python main.py
